server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: intelligent-analysis-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://192.168.1.114:3306/intelligent_analysis_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  sql:
    init:
      mode: always
      continue-on-error: false
      separator: //

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true

connector:
  pool:
    max-pool-size: 5
    connection-timeout-ms: 3000
    idle-timeout-ms: 600000
  query:
    default-timeout-ms: 10000
    default-page-size: 200
    default-cache-ttl-seconds: 60

analysis:
  execution:
    async:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 100
  governance:
    slow-query-threshold-ms: 5000
    tenant-qps-limit: 20
    datasource-concurrency-limit: 10

datasource:
  credential:
    secret: 12345678123456781234567812345678

logging:
  level:
    com.kuaishou.intelligentanalysisplatform: DEBUG
  structured:
    json: true

export:
  storage:
    local-path: ${EXPORT_LOCAL_PATH:/tmp/exports}
    file-ttl-hours: 24

sandbox:
  java:
    max-memory-mb: 256
    max-timeout-seconds: 30
    blacklisted-imports: java.io,java.net,java.nio.file,java.lang.reflect,sun.,com.sun.,java.lang.Runtime,java.lang.Process,java.lang.ProcessBuilder
  python:
    mode: restricted          # restricted | firejail | sidecar
    max-memory-mb: 256
    max-timeout-seconds: 30
    python-bin: python3
    blocked-modules: os,subprocess,socket,shutil,pathlib,tempfile,ctypes,multiprocessing,threading,concurrent,pty,signal,resource

ai:
  provider:
    type: openai
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:sk-6ad391af1f354c1fa4ecafbc52e8eda9}
    model: ${AI_MODEL:deepseek-v4-pro}
    embedding-model: ${AI_EMBEDDING_MODEL:deepseek-v4-pro}
    timeout-seconds: 60
    max-tokens: 4096
    stream-threads: 20

knowledge:
  es:
    url: ${KNOWLEDGE_ES_URL:http://192.168.1.114:9200}
    index-name: ${KNOWLEDGE_ES_INDEX:intelligent_analysis_knowledge}
    vector-dimension: 1536
    num-candidates: 100
    username: ${KNOWLEDGE_ES_USERNAME:}
    password: ${KNOWLEDGE_ES_PASSWORD:}
    connect-timeout-seconds: 5
    read-timeout-seconds: 30

elasticsearch:
  log:
    enabled: false
    urls: ${ES_URLS:http://192.168.1.114:9200}
    index-prefix: ${ES_INDEX_PREFIX:intelligent-analysis-platform}
    batch-size: 200
    flush-interval-seconds: 5
    connect-timeout-seconds: 5
    read-timeout-seconds: 10
    max-retries: 3
    verbose: false
